name: Build Node.js Addon

on:
  push:
    branches: [ main ]
    paths:
      - 'nodejs/package.json'  # Only trigger when package.json changes (version bump)
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'nodejs/package.json'
  workflow_dispatch:  # Manual trigger still available

jobs:
  build-addon:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            platform: linux-x64
            artifact: zigpug.node

          # Linux ARM64
          - os: ubuntu-latest-arm64
            platform: linux-arm64
            artifact: zigpug.node

          # macOS Intel
          - os: macos-15-intel
            platform: darwin-x64
            artifact: zigpug.node

          # macOS Apple Silicon
          - os: macos-14
            platform: darwin-arm64
            artifact: zigpug.node

          # Windows: Temporarily disabled - MinGW/MSVC incompatibility
          # Users can build locally with MinGW or use WSL
          # - os: windows-latest
          #   platform: win32-x64
          #   artifact: zigpug.node

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install and build
      - name: Install dependencies
        working-directory: nodejs
        run: npm install

      - name: Build addon
        working-directory: nodejs
        run: npm run rebuild

      - name: Test addon
        working-directory: nodejs
        run: npm test

      # Copy to prebuilt-binaries directory
      - name: Organize addon
        shell: bash
        run: |
          mkdir -p nodejs/prebuilt-binaries/${{ matrix.platform }}
          cp nodejs/build/Release/zigpug.node nodejs/prebuilt-binaries/${{ matrix.platform }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.platform }}
          path: nodejs/prebuilt-binaries/${{ matrix.platform }}/zigpug.node
          retention-days: 30

  # Combinar todos los addons en un solo artifact
  combine-artifacts:
    name: Combine all addons
    needs: build-addon
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits back to repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize addons
        run: |
          mkdir -p nodejs/prebuilt-binaries

          # Copy each platform's addon (Windows temporarily excluded)
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            if [ -d "artifacts/addon-$platform" ]; then
              mkdir -p nodejs/prebuilt-binaries/$platform
              cp artifacts/addon-$platform/zigpug.node nodejs/prebuilt-binaries/$platform/
              echo "✓ Copied $platform"
            else
              echo "⚠️  Missing $platform artifact"
            fi
          done

          # List what we have
          find nodejs/prebuilt-binaries -name "*.node" -ls

      - name: Upload combined addons
        uses: actions/upload-artifact@v4
        with:
          name: all-node-addons
          path: nodejs/prebuilt-binaries/
          retention-days: 90

      # Commit binaries back to repository (only on main branch, not PRs or tags)
      - name: Commit prebuilt binaries to repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add only .node files
          git add nodejs/prebuilt-binaries/**/*.node

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to prebuilt binaries"
          else
            git commit -m "Update prebuilt Node.js addons [skip ci]

            Auto-generated by GitHub Actions
            Platforms: linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64

            🤖 Generated with Claude Code"

            git push
          fi

      # Optional: Create release on tag push
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: nodejs/prebuilt-binaries/**/zigpug.node
          generate_release_notes: true
