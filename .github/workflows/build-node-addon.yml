name: Build Node.js Addon

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-addon:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            platform: linux-x64
            artifact: zigpug.node

          # macOS Intel
          - os: macos-13
            platform: darwin-x64
            artifact: zigpug.node

          # macOS Apple Silicon
          - os: macos-14
            platform: darwin-arm64
            artifact: zigpug.node

          # Windows
          - os: windows-latest
            platform: win32-x64
            artifact: zigpug.node

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Static libraries are already in nodejs/prebuilts/
      # No need to rebuild them - node-gyp will use them directly

      - name: Install dependencies
        working-directory: nodejs
        run: npm install

      - name: Build addon
        working-directory: nodejs
        run: npm run rebuild

      - name: Test addon
        working-directory: nodejs
        run: npm test

      # Copy to prebuilt-binaries directory
      - name: Organize addon
        shell: bash
        run: |
          mkdir -p nodejs/prebuilt-binaries/${{ matrix.platform }}
          cp nodejs/build/Release/zigpug.node nodejs/prebuilt-binaries/${{ matrix.platform }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.platform }}
          path: nodejs/prebuilt-binaries/${{ matrix.platform }}/zigpug.node
          retention-days: 30

  # Combinar todos los addons en un solo artifact
  combine-artifacts:
    name: Combine all addons
    needs: build-addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize addons
        run: |
          mkdir -p nodejs/prebuilt-binaries

          # Copy each platform's addon
          for platform in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
            if [ -d "artifacts/addon-$platform" ]; then
              mkdir -p nodejs/prebuilt-binaries/$platform
              cp artifacts/addon-$platform/zigpug.node nodejs/prebuilt-binaries/$platform/
            fi
          done

          # List what we have
          find nodejs/prebuilt-binaries -name "*.node" -ls

      - name: Upload combined addons
        uses: actions/upload-artifact@v4
        with:
          name: all-node-addons
          path: nodejs/prebuilt-binaries/
          retention-days: 90

      # Optional: Create release on tag push
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: nodejs/prebuilt-binaries/**/zigpug.node
          generate_release_notes: true
